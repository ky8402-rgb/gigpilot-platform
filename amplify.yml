version: 1
frontend:
  phases:
    preBuild:
      commands:
        - BACKEND_URL="${VITE_BACKEND_URL:-${API_BASE_URL:-https://3-222-149-9.sslip.io}}"
        - echo "REACT_APP_API_URL=${BACKEND_URL}" > .env.production
        - echo "API_BASE_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_BACKEND_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_API_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_API_BASE_URL=${BACKEND_URL}" >> .env.production
        - if [ -n "$FREELANCER_CLIENT_ID" ]; then echo "VITE_FREELANCER_CLIENT_ID=${FREELANCER_CLIENT_ID}" >> .env.production; fi
        - if [ -n "$FREELANCER_API_BASE_URL" ]; then echo "VITE_FREELANCER_API_BASE_URL=${FREELANCER_API_BASE_URL}" >> .env.production; fi
        - if [ -n "$FREELANCER_ACCESS_TOKEN" ]; then echo "FREELANCER_ACCESS_TOKEN=${FREELANCER_ACCESS_TOKEN}" >> .env.production; fi
        - npm ci || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build:client || npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

customHeaders:
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

customRules:
  - source: '/api/<*>'
    target: 'https://3-222-149-9.sslip.io/api/<*>'
    status: '200'
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|html)$)([^.]+$)/>'
    target: '/index.html'
    status: '200'
