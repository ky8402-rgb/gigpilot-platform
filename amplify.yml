version: 1
frontend:
  phases:
    preBuild:
      commands:
        - BACKEND_URL="${VITE_BACKEND_URL:-${API_BASE_URL:-https://35-154-110-156.sslip.io}}"
        - echo "REACT_APP_API_URL=${BACKEND_URL}" > .env.production
        - echo "API_BASE_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_BACKEND_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_API_URL=${BACKEND_URL}" >> .env.production
        - echo "VITE_API_BASE_URL=${BACKEND_URL}" >> .env.production
        - npm ci || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build:client || npm run build
        # version.json records the commit the ARTIFACT was built from, and the deploy workflow
        # verifies the live frontend against it. `AWS_COMMIT_ID` cannot be trusted on its own: a
        # RELEASE job — which is what the deploy workflow triggers — reports the literal string
        # "HEAD" instead of a SHA, so the verification compared "HEAD" against the real commit and
        # failed on every release WHILE THE BUILD ITSELF SUCCEEDED. The failure looked like a bad
        # deploy when the artifact was in fact correct and only its self-report was wrong.
        #
        # The build phase runs against a real checkout, so `git rev-parse HEAD` is authoritative
        # here. "HEAD" and empty are both treated as "ask git"; anything that already looks like a
        # SHA is kept.
        - |
          COMMIT="${AWS_COMMIT_ID:-}"
          case "$COMMIT" in
            ""|HEAD|head|refs/heads/*) COMMIT="$(git rev-parse HEAD 2>/dev/null || echo unknown)" ;;
          esac
          printf '{"commit":"%s"}\n' "$COMMIT" > dist/version.json
          echo "version.json commit -> $COMMIT"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

customHeaders:
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

customRules:
  - source: '/api/<*>'
    target: 'https://35-154-110-156.sslip.io/api/<*>'
    status: '200'
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|html)$)([^.]+$)/>'
    target: '/index.html'
    status: '200'
