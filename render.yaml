services:
  # Web Service running the Express API and Vite React frontend
  - type: web
    name: gigpilot-freelance-os
    env: node
    plan: starter
    region: ohio
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false

  # Dedicated Background Worker for Hourly Sync, Auto-Bidding & AI Drafts
  - type: worker
    name: gigpilot-background-worker
    env: node
    plan: starter
    region: ohio
    buildCommand: npm run build
    startCommand: node dist/worker.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
