[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# WARNINGS ARE ERRORS — for OUR code.
#
# The Python gate runs under `PYTHONWARNINGS=error` (see `npm run test:python:gate` and the deploy
# workflow's "Run pytest with warnings as errors" step). That is the right default: an unclosed
# aiohttp session, a deprecated `asyncio.get_event_loop`, or a silently-truncated conversion is a
# defect, and a warning nobody reads is a defect that ships.
#
# ONE exception, and it is third-party rather than ours:
#
#   starlette >= 1.7 warns at IMPORT time of `starlette.testclient` that "Using `httpx` with
#   `starlette.testclient` is deprecated; install `httpx2` instead". `fastapi.testclient` re-exports
#   it, so merely importing the test client raises under warnings-as-errors, and every
#   TestClient-based gate (test_health_disclosure, test_auth_throttle, test_dashboard_delivery,
#   test_control_plane_auth, test_runtime_secrets, ...) becomes an ERROR at COLLECTION before a
#   single assertion runs.
#
#   `requirements-dev.txt` pins `httpx>=0.27.0` for `starlette.testclient` and `requirements.txt`
#   pins `fastapi>=0.110.0`, both deliberately without an upper bound, so whichever starlette is
#   current arrives. Escalating THIS warning makes the gate unrunnable on a recent install while
#   telling us nothing about our own code — it is a false positive, not a finding.
#
# So exactly this one message is downgraded, matched by message AND by category, and everything else
# stays fatal. Migrating to starlette's preferred client library touches every TestClient-based gate
# and belongs in its own change, not folded into an unrelated one.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
