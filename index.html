  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="job-ticker" class="hidden"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const BACKEND_BASE = 'https://gigpilot-backend.onrender.com';
        const apiUrl = `${BACKEND_BASE}/api/bids?limit=10`;
        fetch(apiUrl)
          .then(res => res.json())
          .then(data => {
            const ticker = document.getElementById('job-ticker');
            const bidsList = Array.isArray(data) ? data : (data.bids || []);
            if (ticker && bidsList.length > 0) {
              ticker.innerHTML = '';
              bidsList.slice(0, 5).forEach(job => {
                const div = document.createElement('div');
                div.innerHTML = `🔥 ${job.job_title || job.title} → <a href="${job.job_url || job.url || '#'}" target="_blank" rel="noopener noreferrer">View Bid</a> (Package: ${job.package || 'General'})`;
                ticker.appendChild(div);
              });
            }
          })
          .catch(err => console.log('Job ticker loaded or deferred:', err));
      })();
    </script>
  </body>
