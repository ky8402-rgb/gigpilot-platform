# ---------------------------------------------------------------------------
# Quant futures trading platform — runtime configuration.
#
# Secrets (api_key / api_secret) are NEVER stored here. Put them in .env.
# Any value can be overridden with an env var: QUANT__RISK__MAX_LEVERAGE=3
# ---------------------------------------------------------------------------

log_level: INFO
log_json: true

exchange:
  # Venue: "bybit" (linear / USDT perps) or "binance" (usdm).
  name: bybit
  market_type: linear
  rest_url: https://api.bybit.com
  ws_url: wss://stream.bybit.com/v5/public/linear
  testnet: false
  recv_window_ms: 5000
  request_timeout_s: 10.0
  max_retries: 4
  depth_levels: 50

universe:
  # Empty list = auto-screen the exchange for the most liquid perpetuals.
  symbols: []
  quote: USDT
  min_24h_quote_volume: 200000000   # $200M/24h floor
  max_symbols: 10
  exclude_bases: [USDC, FDUSD, TUSD, BUSD, DAI, BTCDOM, DEFI]
  refresh_minutes: 30

costs:
  # Bybit USDT-perp standard rates. Binance usdm is maker 2.0 / taker 5.0.
  maker_fee_bps: 2.0
  taker_fee_bps: 5.5
  fallback_slippage_bps: 2.0
  adverse_selection_bps: 1.0
  assume_taker_entry: true
  assume_taker_exit_on_stop: true
  hurdle_multiplier: 2.0
  min_edge_bps: 8.0
  funding_intervals_per_day: 3

risk:
  starting_equity: 10000.0
  risk_per_trade_pct: 0.5
  max_leverage: 5.0
  max_position_notional_pct: 25.0
  max_concurrent_positions: 3
  max_gross_exposure_x: 1.0
  max_symbol_exposure_pct: 25.0
  daily_loss_limit_pct: 3.0
  max_drawdown_pct: 12.0
  max_consecutive_losses: 5
  max_spread_bps: 4.0
  min_expected_holding_bars: 3
  max_data_age_s: 180.0

strategy:
  ema_fast: 21
  ema_slow: 55
  ema_trend: 200
  adx_period: 14
  adx_min: 20.0
  donchian_period: 20
  atr_period: 14
  roc_period: 10
  rsi_period: 14
  bb_period: 20
  bb_k: 2.0
  breakout_buffer_atr: 0.15
  min_momentum_atr: 0.25
  require_htf_alignment: true
  htf_multiple: 4
  min_edge_samples: 10
  min_edge_tstat: 1.0
  atr_stop_mult: 2.0
  tp_r_multiple: 2.5
  breakeven_after_r: 1.0
  trailing_start_r: 1.0
  trailing_atr_mult: 1.5

execution:
  mode: paper            # "paper" or "live". Live also needs allow_live + env ack.
  order_type: market
  maker_timeout_s: 20
  limit_offset_bps: 1.0
  allow_live: false
  max_orders_per_day: 200
  max_consecutive_rejects: 5

data:
  primary_interval: 1h
  kline_limit: 1000
  history_bars: 10000
  persist_candles: true
  ws_enabled: true
  ws_stale_timeout_s: 90.0
  rest_poll_seconds: 30.0
  db_path: data/db/quant.db

api:
  host: 0.0.0.0
  port: 8080
  token: ""              # auto-generated if empty
  rate_limit_per_min: 600
  cors_origins: ["*"]

learning:
  enabled: true
  optimize_every_hours: 24.0
  lookback_bars: 4000
  train_bars: 1200
  test_bars: 400
  step_bars: 300
  min_trades_per_fold: 5
  promotion_margin: 0.10
  max_param_sets: 24

health:
  heartbeat_seconds: 10.0
  stale_feed_halt_s: 300.0
  reconcile_seconds: 60.0
  auto_rollback_drawdown_pct: 6.0
