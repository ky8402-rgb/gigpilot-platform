# nginx vhost for the quant platform.
#
# COEXISTENCE: this uses the DOTTED sslip.io form, which resolves to the same
# address but is a DIFFERENT hostname, so it gets its own server block and its own
# certificate. It does not modify or shadow any existing vhost, and it binds no new
# port — nginx keeps 80/443, the app stays on 127.0.0.1:8080.
#
#   35-154-110-156.sslip.io   -> whatever already runs there   (untouched)
#   35.154.110.156.sslip.io   -> this platform                 (this file)
#
# Install:
#   sudo cp ops/production/nginx-quant.conf /etc/nginx/sites-available/quant
#   sudo ln -s /etc/nginx/sites-available/quant /etc/nginx/sites-enabled/quant
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 35.154.110.156.sslip.io     # issues the TLS cert

server {
    listen 80;
    listen [::]:80;
    server_name 35.154.110.156.sslip.io;

    # certbot rewrites this block to add the 443 listener and the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 35.154.110.156.sslip.io;

    # certbot --nginx manages these lines.
    # ssl_certificate     /etc/letsencrypt/live/35.154.110.156.sslip.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/35.154.110.156.sslip.io/privkey.pem;

    # The app is bound to loopback and must not be reachable directly.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # The dashboard streams live state over a websocket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Never expose logs or credentials through the proxy, even if requested.
    location ~* /(\.env|data/|\.git/) {
        deny all;
        return 404;
    }

    client_max_body_size 2m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
