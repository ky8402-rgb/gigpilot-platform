name: Python FastAPI Production Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: production-deploy-main
  cancel-in-progress: true
jobs:
  validate:
    name: Python and React validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Upload verified React build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist
          retention-days: 3
      # BOTH files: the gates below run TestClient-based tests (test_dashboard_delivery) and the
      # pytest suite, so they need test-only packages. Installing only requirements.txt previously
      # worked by accident — httpx came in transitively via the unused google-genai package, so
      # removing that package broke this job. scripts/deploy-ec2.sh already installed both; the
      # workflows did not.
      - run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -r requirements-dev.txt
      - run: python tests/test_python_only_runtime.py
      - run: python tests/test_parity.py
      - run: python tests/test_execution_idempotency.py
      - run: python tests/test_package_seams.py
      - run: python tests/test_dashboard_delivery.py
      - run: python -m pytest tests/ -q --no-header
  deploy:
    name: Deploy FastAPI runtime to EC2
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified React build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist
      - name: Verify database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: python -c "import os,re; x=os.environ['DATABASE_URL']; assert re.match(r'^postgres(ql)?://',x)"
      - name: Deploy over approved SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY || '' }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          test -n "$EC2_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "echo SSH_OK"
          tar -C dist -czf - . | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/gigpilot/dist && tar -xzf - -C /home/ubuntu/gigpilot/dist"
          { printf 'export DATABASE_URL=%q\n' "$DATABASE_URL"; printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"; printf 'export BYBIT_API_KEY=%q\n' "$BYBIT_API_KEY"; printf 'export BYBIT_API_SECRET=%q\n' "$BYBIT_API_SECRET"; printf 'export GITHUB_TOKEN=%q\n' "$GITHUB_TOKEN"; cat scripts/deploy-ec2.sh; } | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "bash -s"
      - name: Verify exact deployed SHA and FastAPI
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          BASE="https://$(printf '%s' "$EC2_HOST" | tr '.' '-').sslip.io"
          curl -kfsS "$BASE/api/health" -o /tmp/health.json
          python -c "import json,os; x=json.load(open('/tmp/health.json')); assert x.get('deployedCommit')==os.environ['GITHUB_SHA']; assert x.get('autonomousEngine',{}).get('reachable') is True"
          curl -kfsS "$BASE/" | grep -Eiq '<html|<script|<div'
          curl -kfsS "$BASE/version.json" | python -c "import json,sys,os; assert json.load(sys.stdin).get('commit')==os.environ['GITHUB_SHA']"
