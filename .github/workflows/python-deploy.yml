name: Python FastAPI Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # BOTH files: the gates below run TestClient-based tests (test_dashboard_delivery) and the
      # pytest suite, so they need test-only packages. Installing only requirements.txt previously
      # worked by accident — httpx came in transitively via the unused google-genai package, so
      # removing that package broke this job.
      - name: Install dependencies
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -r requirements-dev.txt

      # The tree is Python-only: there is no npm install, no TypeScript typecheck and no bundle to
      # build. The console is rendered by the same Python process that serves the API.
      - name: Lint and typecheck
        run: |
          python -m ruff check .
          python -m flake8 .
          python -m mypy .

      - name: Structural gates
        run: |
          python tests/test_python_only_runtime.py
          python tests/test_parity.py
          python tests/test_execution_idempotency.py
          python tests/test_package_seams.py
          python tests/test_dashboard_delivery.py
          python tests/test_l2_ingestion_indicator.py

      - name: Run pytest with warnings as errors
        env:
          PYTHONWARNINGS: error
        run: python -m pytest tests/ -q --no-header

  deploy:
    name: Deploy FastAPI runtime to EC2
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: python -c "import os,re; x=os.environ['DATABASE_URL']; assert re.match(r'^postgres(ql)?://',x)"

      # The host pulls the revision itself (`git reset --hard origin/main` inside deploy-ec2.sh), so
      # the only artifact that used to be shipped from here was the prebuilt frontend bundle. That
      # bundle no longer exists, which is why this step is now a plain deploy trigger.
      - name: Deploy over approved SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY || '' }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          test -n "$EC2_HOST" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "echo SSH_OK"
          # ServerAliveInterval/CountMax keep the SSH connection alive through the long host-side
          # phase (pip install + full gate suite + systemd restart + health verify). Without them the
          # connection can drop idle ("Broken pipe") after the gates pass but before the restart
          # completes, leaving production down on an otherwise-clean rollout.
          { printf 'export DATABASE_URL=%q\n' "$DATABASE_URL"; printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"; printf 'export BYBIT_API_KEY=%q\n' "$BYBIT_API_KEY"; printf 'export BYBIT_API_SECRET=%q\n' "$BYBIT_API_SECRET"; printf 'export GITHUB_TOKEN=%q\n' "$GITHUB_TOKEN"; cat scripts/deploy-ec2.sh; } | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "bash -s"

      - name: Verify exact deployed SHA and FastAPI
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          BASE="https://$(printf '%s' "$EC2_HOST" | tr '.' '-').sslip.io"
          curl -kfsS "$BASE/api/health" -o /tmp/health.json
          python -c "import json,os; x=json.load(open('/tmp/health.json')); assert x.get('deployedCommit')==os.environ['GITHUB_SHA']; assert x.get('autonomousEngine',{}).get('reachable') is True"
          # DAEMON health, NOT live arming. A cold boot in runtime-secret mode is SUPPOSED to report
          # engine_state=AWAITING_SECRET: nothing can be signed before an operator supplies the
          # secret, and POST /api/arm - the only route that accepts it - runs on the very server
          # being deployed. Requiring ARMED here would be self-sealing, so the gate asserts the
          # daemon is alive and the lifecycle state is one of the acceptable ones instead.
          python -c "import json; x=json.load(open('/tmp/health.json')); assert x.get('status')=='ok', x.get('status'); assert x.get('healthy') is True, x.get('healthy'); assert x.get('engine_state') in ('AWAITING_SECRET','ARMED','DISARMED'), x.get('engine_state')"
          curl -kfsS "$BASE/" -o /tmp/index.html
          grep -Eiq '<html|<div' /tmp/index.html
          # The console must be the PYTHON one. Asserting only that some HTML came back would pass
          # against the degenerate fallback page, so the marker below is a feature the real template
          # has and the fallback does not.
          grep -Fq 'Session API credentials' /tmp/index.html
          curl -kfsS "$BASE/version.json" | python -c "import json,sys,os; assert json.load(sys.stdin).get('commit')==os.environ['GITHUB_SHA']"
          curl -kfsS "$BASE/static/dashboard.css" | grep -Fq -- '--bg'
