# CI for the Python quant engine, which lives in `quant-engine/` of this monorepo.
#
# Scope note: this workflow and the AWS deploy workflow are deliberately disjoint —
# `deploy.yml` carries `paths-ignore: ['quant-engine/**']`, and this one triggers only on
# `quant-engine/**`. Editing the engine therefore cannot rebuild the EC2 backend or
# redeploy the frontend, and editing the Node service cannot spin up the Python test
# suite. The two share a repository, not a build.

name: quant-engine CI

on:
  push:
    paths:
      - 'quant-engine/**'
      - '.github/workflows/quant-ci.yml'
  pull_request:
    paths:
      - 'quant-engine/**'
      - '.github/workflows/quant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: quant-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, pytest
    runs-on: ubuntu-latest

    # Everything runs from `quant-engine/` so ruff and mypy pick up this project's
    # pyproject.toml rather than any config at the repository root.
    defaults:
      run:
        working-directory: quant-engine

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The engine's own requirements, so CI tests the dependency set that ships.
          pip install -r requirements.txt
          pip install ruff mypy

      # Rule set is scoped by measurement (see [tool.ruff.lint] in pyproject.toml). It is a
      # BLOCKING gate on the rules that catch runtime breakage — syntax errors, undefined and
      # redefined names. Widening it is a ratchet: clear a rule's backlog, then add its prefix.
      - name: Lint (ruff)
        run: ruff check .

      # Blocking, but scoped to the modules that are clean today. `mypy app` reports 9
      # remaining issues across 4 files (mostly Optional-narrowing). Gating the whole package
      # would make this workflow red on day one for reasons unrelated to any change, and a
      # permanently red gate gets ignored — so the ratchet is explicit and shrinkable instead.
      # Add modules here as they are cleaned up; never remove one.
      - name: Type check (mypy)
        run: mypy app/config.py

      # Deliberately NO `mypy app || true` step. The outstanding 9 issues are recorded in
      # pyproject.toml as the ratchet target; adding a step that cannot fail would just be the
      # same masked-failure pattern this repository removed from the deploy pipeline.

      # The engine's suite must run offline and deterministically: anything that reaches the
      # network belongs in ops/e2e_check.py, not here.
      - name: Tests (pytest)
        run: pytest tests -q
