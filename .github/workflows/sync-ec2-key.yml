name: Sync and Configure EC2_SSH_KEY in GitHub Secrets

on:
  workflow_dispatch:
    inputs:
      pat:
        description: 'GitHub Personal Access Token with repo/workflow scope'
        required: false
        default: ''

jobs:
  configure-key:
    name: 🔑 Validate and Configure EC2_SSH_KEY
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Analyze Existing GitHub Secrets
        id: analyze
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          MUMBAI_KEY: ${{ secrets.GIGPILOT_MUMBAI_EC2 }}
          TARGET_HOST: '35.154.110.156'
        run: |
          mkdir -p /tmp/keys
          
          echo "=== Step 1: Inspecting GIGPILOT_MUMBAI_EC2 secret ==="
          if [ -n "$MUMBAI_KEY" ]; then
            printf '%s\n' "$MUMBAI_KEY" > /tmp/keys/mumbai.raw
            SSH_KEY="$MUMBAI_KEY" python3 scripts/prepare_ec2_key.py || true
            cp ~/.ssh/id_rsa /tmp/keys/mumbai.pem 2>/dev/null || true
            chmod 600 /tmp/keys/mumbai.pem 2>/dev/null || true
            
            if [ -f /tmp/keys/mumbai.pem ] && ssh-keygen -y -f /tmp/keys/mumbai.pem > /tmp/keys/mumbai.pub 2>/dev/null; then
              echo "✔ GIGPILOT_MUMBAI_EC2 is a VALID private key!"
              echo "Public fingerprint: $(ssh-keygen -lf /tmp/keys/mumbai.pub)"
              echo "mumbai_valid=true" >> "$GITHUB_OUTPUT"
            else
              echo "GIGPILOT_MUMBAI_EC2 is not a standard private key."
              echo "mumbai_valid=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "GIGPILOT_MUMBAI_EC2 secret is empty."
            echo "mumbai_valid=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Step 2: Inspecting current EC2_SSH_KEY secret ==="
          if [ -n "$EC2_KEY" ]; then
            printf '%s\n' "$EC2_KEY" > /tmp/keys/current.raw
            SSH_KEY="$EC2_KEY" python3 scripts/prepare_ec2_key.py || true
            cp ~/.ssh/id_rsa /tmp/keys/current.pem 2>/dev/null || true
            chmod 600 /tmp/keys/current.pem 2>/dev/null || true
            
            if [ -f /tmp/keys/current.pem ] && ssh-keygen -y -f /tmp/keys/current.pem > /tmp/keys/current.pub 2>/dev/null; then
              echo "✔ EC2_SSH_KEY is a VALID private key!"
              echo "current_valid=true" >> "$GITHUB_OUTPUT"
            else
              echo "EC2_SSH_KEY is not currently a valid private key."
              echo "current_valid=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "EC2_SSH_KEY is empty."
            echo "current_valid=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Step 3: Test live SSH connectivity ==="
          SSH_SUCCESS=""
          if [ -f /tmp/keys/mumbai.pem ]; then
            echo "Testing connection to ubuntu@$TARGET_HOST with GIGPILOT_MUMBAI_EC2..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 -i /tmp/keys/mumbai.pem ubuntu@$TARGET_HOST "echo SSH_TEST_SUCCESS" 2>&1 | grep -q "SSH_TEST_SUCCESS"; then
              echo "🎉 SUCCESS: Connected to EC2 ($TARGET_HOST) using GIGPILOT_MUMBAI_EC2!"
              SSH_SUCCESS="mumbai"
            fi
          fi

          if [ -z "$SSH_SUCCESS" ] && [ -f /tmp/keys/current.pem ]; then
            echo "Testing connection to ubuntu@$TARGET_HOST with EC2_SSH_KEY..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 -i /tmp/keys/current.pem ubuntu@$TARGET_HOST "echo SSH_TEST_SUCCESS" 2>&1 | grep -q "SSH_TEST_SUCCESS"; then
              echo "🎉 SUCCESS: Connected to EC2 ($TARGET_HOST) using EC2_SSH_KEY!"
              SSH_SUCCESS="current"
            fi
          fi

          echo "ssh_success=$SSH_SUCCESS" >> "$GITHUB_OUTPUT"

          echo "=== Step 4: Inspecting ARN secret ==="
          if [ -n "${{ secrets.ARN }}" ]; then
            ARN_VAL="${{ secrets.ARN }}"
            echo "ARN length: ${#ARN_VAL}, prefix: ${ARN_VAL:0:15}"
          else
            echo "ARN secret is empty."
          fi

      - name: Update GitHub Actions Secret EC2_SSH_KEY
        env:
          GH_TOKEN: ${{ inputs.pat || secrets.GITHUB_TOKEN }}
          MUMBAI_KEY: ${{ secrets.GIGPILOT_MUMBAI_EC2 }}
          IS_MUMBAI_VALID: ${{ steps.analyze.outputs.mumbai_valid }}
          SSH_SUCCESS: ${{ steps.analyze.outputs.ssh_success }}
        run: |
          echo "Updating EC2_SSH_KEY secret on GitHub..."
          if [ "$IS_MUMBAI_VALID" = "true" ] || [ "$SSH_SUCCESS" = "mumbai" ]; then
            echo "Writing GIGPILOT_MUMBAI_EC2 into EC2_SSH_KEY secret..."
            printf '%s\n' "$MUMBAI_KEY" | gh secret set EC2_SSH_KEY --repo "$GITHUB_REPOSITORY"
            echo "✔ Successfully updated EC2_SSH_KEY with the actual EC2 private key in GitHub!"
          elif [ -f /tmp/keys/mumbai.raw ]; then
            echo "Writing normalized raw Mumbai key into EC2_SSH_KEY..."
            gh secret set EC2_SSH_KEY --repo "$GITHUB_REPOSITORY" < /tmp/keys/mumbai.raw
            echo "✔ Updated EC2_SSH_KEY secret via GitHub CLI."
          else
            echo "⚠️ Neither key was recognized as a valid private key."
          fi
