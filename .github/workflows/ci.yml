name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # BOTH files. The gates below exercise FastAPI TestClient, so they need test-only packages
      # (httpx, pytest). Installing only requirements.txt previously "worked" by accident: httpx
      # arrived transitively via google-genai, so removing that genuinely-unused package exposed a
      # phantom dependency and broke CI. Declaring it here keeps a test framework out of the runtime
      # image while making the gate's real requirements explicit.
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -r requirements-dev.txt

      # There is no Node/TypeScript surface left to typecheck or bundle: the console is rendered by
      # the same Python process that serves the API.
      - name: Lint and typecheck
        run: |
          python -m ruff check .
          python -m flake8 .
          python -m mypy .

      # Python-side gates. test_parity enforces that every entry of the historical Node surface
      # carries an explicit decision and refuses `removed` without a proven replacement.
      # test_execution_idempotency locks the order paths to one submission helper.
      # test_package_seams pins that re-exported symbols stay the SAME OBJECT (a duplicate BybitError
      # class would silently break `except` across modules). test_python_only_runtime asserts the
      # finished migration in both directions: no JS/TS anywhere, AND a real Python console present.
      # None optional.
      - name: Structural gates
        run: |
          python tests/test_python_only_runtime.py
          python tests/test_parity.py
          python tests/test_execution_idempotency.py
          python tests/test_package_seams.py
          python tests/test_dashboard_delivery.py
          python tests/test_l2_ingestion_indicator.py

      # The deploy workflow runs the complete Python suite before touching EC2. PR CI must run the
      # same suite or "green CI" can merge a change that is guaranteed to fail the release gate.
      - name: Full Python regression suite
        env:
          PYTHONWARNINGS: error
        run: python -m pytest tests/ -q --no-header
