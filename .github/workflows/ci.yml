name: CI

on:
  pull_request:
    branches: [main, master]
    # The Python engine has its own CI (.github/workflows/quant-ci.yml). Without this filter a
    # change under quant-engine/ would run a Node typecheck and production build that cannot be
    # affected by it — measured: it fired on the engine-only commit c5d2bcf.
    paths-ignore:
      - 'quant-engine/**'
  push:
    branches: [main, master]
    # Same filter as the pull_request trigger above. Standard paths-ignore semantics apply: the
    # filter skips the run only when EVERY changed file matches, so a commit touching both trees
    # still runs both workflows — which is correct, because it genuinely affects both.
    paths-ignore:
      - 'quant-engine/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]+|BINANCE_API_(KEY|SECRET)=['\"]?[A-Za-z0-9+/=_-]{20,}['\"]?|GITHUB_WEBHOOK_SECRET=['\"]?[A-Za-z0-9+/=_-]{32,}['\"]?)' -- ':!*.lock' ':!AWS_DEPLOYMENT.md' ':!.github/workflows/ci.yml' ':!scripts/prepare_ec2_key.py'; then
            echo 'Potential credential material found in tracked source.' >&2
            exit 1
          fi

      - name: Production build
        run: npm run build
