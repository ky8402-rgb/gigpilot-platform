name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test

      # BOTH files. The gates below exercise FastAPI TestClient, so they need test-only packages
      # (httpx, pytest). Installing only requirements.txt previously "worked" by accident: httpx
      # arrived transitively via google-genai, so removing that genuinely-unused package exposed a
      # phantom dependency and broke CI. Declaring it here keeps a test framework out of the runtime
      # image while making the gate's real requirements explicit.
      - name: Install Python dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 -m pip install --quiet -r requirements-dev.txt

      # Python-side gates. test_parity enforces that the Node surface stays mapped while the
      # migration is in flight (so a new Node endpoint cannot slip past it), and refuses `removed`
      # without a proven replacement. test_execution_idempotency locks the order paths to one
      # submission helper. test_package_seams pins that re-exported symbols stay the SAME OBJECT
      # (a duplicate BybitError class would silently break `except` across modules). None optional.
      - name: Python lint and typecheck
        run: |
          python3 -m ruff check --select F gpkg/ml/audit.py gpkg/ml/data.py gpkg/ml/hypotheses.py gpkg/ml/training.py gpkg/persistence/store.py scripts/ml_research.py
          python3 -m mypy --ignore-missing-imports gpkg/ml/audit.py gpkg/ml/data.py gpkg/ml/hypotheses.py gpkg/ml/training.py gpkg/persistence/store.py scripts/ml_research.py

      - name: React lint and typecheck
        run: npm run lint

      - name: Python gates (migration parity + execution idempotency + package seams + dashboard delivery)
        run: |
          python3 tests/test_parity.py
          python3 tests/test_execution_idempotency.py
          python3 tests/test_package_seams.py
          python3 tests/test_dashboard_delivery.py

      # The deploy workflow runs the complete Python suite before touching EC2. PR CI must run the
      # same suite or "green CI" can merge a change that is guaranteed to fail the release gate.
      # The targeted scripts above remain because they provide clearer invariant-specific output.
      - name: Full Python regression suite
        run: python3 -m pytest tests/ -q --no-header

      - name: Production build
        run: npm run build
