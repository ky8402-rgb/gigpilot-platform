name: Deploy to AWS Amplify (Frontend) & EC2 (Backend)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: ⏳ Wait for CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit CI success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI checks on ${SHA}..."
          for attempt in $(seq 1 40); do
            curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" -o /tmp/check_runs.json
            RESULT="$(node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("/tmp/check_runs.json", "utf8"));
              const ci = (data.check_runs || []).find(x => x.name === "Typecheck and production build");
              process.stdout.write(JSON.stringify({status: ci?.status || "", conclusion: ci?.conclusion || ""}));
            ')"
            STATUS="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "${RESULT}")"
            CONCLUSION="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).conclusion)' "${RESULT}")"
            echo "CI status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${CONCLUSION}" = "success" ]; then
              echo "✔ Exact commit CI passed."
              exit 0
            fi
            if [ "${CONCLUSION}" = "failure" ] || [ "${CONCLUSION}" = "cancelled" ] || [ "${CONCLUSION}" = "timed_out" ]; then
              echo "ERROR: Exact commit CI did not pass."
              exit 1
            fi
            sleep 15
          done
          echo "ERROR: Timed out waiting for exact commit CI."
          exit 1

  deploy-amplify:
    needs: wait-for-ci
    name: 🚀 Deploy Frontend (AWS Amplify - gigpilot-platform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Availability
        id: check_amplify_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials (Optional)
        if: steps.check_amplify_aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Trigger AWS Amplify Release Job
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID || 'd2qe2q720fbn3x' }}
          AMPLIFY_WEBHOOK: ${{ secrets.AMPLIFY_DEPLOY_WEBHOOK_URL }}
        run: |
          echo "=========================================================="
          echo "AWS Amplify Frontend Auto-Deploy (gigpilot-platform)"
          echo "Repository is linked to AWS Amplify App: $AMPLIFY_APP_ID"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "=========================================================="
          
          # AWS Amplify is directly linked to this repo and auto-detects pushes to main
          echo "ℹ AWS Amplify is linked to this GitHub repository."
          echo "ℹ Push to '${GITHUB_REF_NAME}' automatically triggers Amplify frontend build via amplify.yml."

          # If AWS CLI credentials configured, also trigger start-job for immediate dispatch
          if command -v aws &>/dev/null && [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            BRANCH_NAME="${GITHUB_REF_NAME}"
            echo "Initiating explicit start-job on branch $BRANCH_NAME..."
            aws amplify start-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$BRANCH_NAME" \
              --job-type RELEASE || echo "Notice: AWS CLI start-job completed or branch handled natively."
          fi
          
          # If incoming deploy webhook is configured in GitHub secrets
          if [ -n "$AMPLIFY_WEBHOOK" ]; then
            echo "Invoking incoming deployment webhook..."
            curl -sS -X POST -d '{}' "$AMPLIFY_WEBHOOK" || true
          fi
          
          echo "✔ AWS Amplify frontend deployment trigger completed."
          echo "Amplify URL: https://main.$AMPLIFY_APP_ID.amplifyapp.com"
          echo "Waiting for the deployed frontend to expose its exact commit..."
          FRONTEND_URL="https://main.$AMPLIFY_APP_ID.amplifyapp.com"
          VERIFIED=0
          for attempt in $(seq 1 30); do
            VERSION_JSON="$(curl -fsSL "$FRONTEND_URL/version.json" --max-time 10 || true)"
            RUNNING_COMMIT="$(node -e 'try { const x=JSON.parse(process.argv[1]); process.stdout.write(x.commit || "") } catch { process.stdout.write("") }' "$VERSION_JSON")"
            if [ "$RUNNING_COMMIT" = "$GITHUB_SHA" ]; then
              echo "✔ Amplify frontend is serving the exact GitHub SHA: $RUNNING_COMMIT"
              VERIFIED=1
              break
            fi
            echo "Amplify commit not verified yet: running=$RUNNING_COMMIT expected=$GITHUB_SHA attempt=$attempt/30"
            sleep 10
          done
          if [ "$VERIFIED" -ne 1 ]; then
            echo "ERROR: Amplify frontend deployment was triggered but exact-commit live verification failed."
            exit 1
          fi

      - name: Report Amplify Status to Step Summary
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID || 'd2qe2q720fbn3x' }}
        run: |
          echo "### 🚀 AWS Amplify Frontend Auto-Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** gigpilot-platform" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** \`$AMPLIFY_APP_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-Deploy Status:** ✅ Triggered on push to \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [https://main.$AMPLIFY_APP_ID.amplifyapp.com](https://main.$AMPLIFY_APP_ID.amplifyapp.com)" >> $GITHUB_STEP_SUMMARY

  live-compatibility:
    needs: [deploy-amplify, deploy-ec2]
    name: 🔎 Verify Live Frontend/Backend Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify live frontend, backend, CORS, auth boundary, and API contract
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID || 'd2qe2q720fbn3x' }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          if [ -z "$EC2_HOST" ]; then echo "ERROR: No production EC2 host configured."; exit 1; fi
          FRONTEND="https://main.$AMPLIFY_APP_ID.amplifyapp.com"
          BACKEND="https://${EC2_HOST//./-}.sslip.io"
          HTML="$(curl -fsSL "$FRONTEND/" --max-time 15)"
          echo "$HTML" | grep -Eqi '<html|<script|<div' || { echo "ERROR: Live frontend did not return expected HTML."; exit 1; }
          VERSION="$(curl -fsSL "$FRONTEND/version.json" --max-time 15)"
          COMMIT="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.commit||"")' "$VERSION")"
          [ "$COMMIT" = "$GITHUB_SHA" ] || { echo "ERROR: Frontend SHA mismatch: $COMMIT != $GITHUB_SHA"; exit 1; }
          HEALTH="$(curl -fsSL "$BACKEND/api/health" --max-time 10)"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="ok"||x.deployedCommit!==process.argv[2]) process.exit(1)' "$HEALTH" "$GITHUB_SHA"
          STATE_CODE="$(curl -sS -o /tmp/state.json -w '%{http_code}' -H 'Accept: application/json' "$BACKEND/api/trading/state" --max-time 10)"
          case "$STATE_CODE" in 401|403) echo "✔ Private trading state rejects unauthenticated access with HTTP $STATE_CODE.";; *) echo "ERROR: Private trading state returned HTTP $STATE_CODE"; cat /tmp/state.json; exit 1;; esac

          ASSETS_CODE="$(curl -sS -o /tmp/assets.json -w '%{http_code}' -H 'Accept: application/json' "$BACKEND/api/trading/assets" --max-time 10)"
          case "$ASSETS_CODE" in 401|403) echo "✔ Private asset data rejects unauthenticated access with HTTP $ASSETS_CODE.";; *) echo "ERROR: Private assets endpoint returned HTTP $ASSETS_CODE"; cat /tmp/assets.json; exit 1;; esac
          RISK_CODE="$(curl -sS -o /tmp/risk.json -w '%{http_code}' -H 'Accept: application/json' "$BACKEND/api/trading/risk" --max-time 10)"
          [ "$RISK_CODE" = "200" ] || { echo "ERROR: Live risk endpoint returned HTTP $RISK_CODE"; cat /tmp/risk.json; exit 1; }
          AUTH_STATUS="$(curl -sS -o /tmp/auth-status.json -w '%{http_code}' -H "Origin: $FRONTEND" -H 'Accept: application/json' "$BACKEND/api/auth/status" --max-time 10)"
          [ "$AUTH_STATUS" = "200" ] || { echo "ERROR: Auth status endpoint returned HTTP $AUTH_STATUS"; cat /tmp/auth-status.json; exit 1; }
          ORDER_CODE="$(curl -sS -o /tmp/order.json -w '%{http_code}' -X POST -H "Origin: $FRONTEND" -H 'Content-Type: application/json' -d '{}' "$BACKEND/api/trading/order/place" --max-time 10)"
          case "$ORDER_CODE" in 401|403) echo "✔ Unauthorized order placement rejected with HTTP $ORDER_CODE.";; *) echo "ERROR: Unauthorized order placement returned HTTP $ORDER_CODE"; cat /tmp/order.json; exit 1;; esac
          OPTIONS_CODE="$(curl -sS -o /tmp/options.txt -w '%{http_code}' -X OPTIONS -H "Origin: $FRONTEND" -H 'Access-Control-Request-Method: GET' "$BACKEND/api/trading/state" --max-time 10)"
          case "$OPTIONS_CODE" in 200|204) echo "✔ CORS preflight accepted with HTTP $OPTIONS_CODE.";; *) echo "ERROR: CORS preflight returned HTTP $OPTIONS_CODE"; cat /tmp/options.txt; exit 1;; esac
          echo "✔ Live frontend/backend compatibility smoke tests passed for $GITHUB_SHA."
  deploy-ec2:
    needs: wait-for-ci
    name: 🛡️ Deploy Backend (AWS EC2 - gigpilot-backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check AWS Secrets for EC2 Connect
        id: check_ec2_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials (Optional for EC2 Connect)
        if: steps.check_ec2_aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS }}
          aws-region: 'ap-south-1'

      - name: Verify Production Database Secret Availability
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DATABASE_URL" | grep -Eq '^postgres(ql)?://' || {
            echo "ERROR: Production deployment is blocked: configure the GitHub Actions secret DATABASE_URL (or NEON_DATABASE_URL)."
            exit 1
          }
          echo "✔ Production database secret is configured."
          echo "::add-mask::$DATABASE_URL"

      - name: Deploy via SSH (Direct EC2 Execution)
        id: ec2_ssh
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || '' }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: No production EC2 host configured. The Bybit-region migration must establish deployment/backend-host.txt first."
            exit 1
          fi
          echo "=========================================================="
          echo "Deploying to AWS EC2 via Secure SSH ($EC2_USER@$EC2_HOST)..."
          echo "=========================================================="
          
          SSH_CONNECTED=0
          mkdir -p ~/.ssh
          
          # 1. Attempt using configured EC2_SSH_KEY
          if [ -n "$SSH_KEY" ]; then
            echo "Normalizing and preparing EC2_SSH_KEY..."
            python3 scripts/prepare_ec2_key.py || true
            
            if [ -f ~/.ssh/id_rsa ] && [ -s ~/.ssh/id_rsa ]; then
              echo "Testing SSH connection with EC2_SSH_KEY..."
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "echo SSH_OK" 2>/dev/null | grep -q "SSH_OK"; then
                echo "✔ Verified SSH access using EC2_SSH_KEY."
                SSH_KEY_FILE=~/.ssh/id_rsa
                SSH_CONNECTED=1
              else
                echo "Notice: Static SSH key could not authenticate or needs EC2 Instance Connect."
              fi
            fi
          fi

          # 2. Fallback to AWS EC2 Instance Connect if AWS credentials exist
          if [ "$SSH_CONNECTED" -eq 0 ] && command -v aws >/dev/null 2>&1; then
            echo "Attempting AWS EC2 Instance Connect push..."
            ssh-keygen -t rsa -b 2048 -f ~/.ssh/ec2_connect -N "" -q
            if aws ec2-instance-connect send-ssh-public-key \
                --instance-id "$EC2_INSTANCE_ID" \
                --instance-os-user "$EC2_USER" \
                --ssh-public-key file://~/.ssh/ec2_connect.pub \
                --region ap-south-1 2>/dev/null; then
              echo "✔ Successfully pushed temporary SSH key via EC2 Instance Connect."
              SSH_KEY_FILE=~/.ssh/ec2_connect
              SSH_CONNECTED=1
            else
              echo "EC2 Instance Connect push not available or IAM permission pending."
            fi
          fi

          if [ "$SSH_CONNECTED" -eq 1 ]; then
            echo "Executing remote production deployment on EC2 via scripts/deploy-ec2.sh..."
            printf '%s\n' "$DATABASE_URL" | grep -Eq '^postgres(ql)?://' || { echo "ERROR: DATABASE_URL/NEON_DATABASE_URL GitHub secret is required for production deployment."; exit 1; }
          { printf 'export DATABASE_URL=%q\n' "$DATABASE_URL"; printf 'export GITHUB_TOKEN=%q\n' "${{ secrets.GITHUB_TOKEN }}"; cat scripts/deploy-ec2.sh; } | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i "$SSH_KEY_FILE" "$EC2_USER@$EC2_HOST" "bash -s"
            echo "✔ SSH deployment command finished successfully."
            echo "DEPLOYMENT_DELIVERY=SSH" >> "$GITHUB_ENV"
            echo "delivery=SSH" >> "$GITHUB_OUTPUT"
          else
            echo "SSH direct connection could not be established. Falling back to signed push webhook."
          fi

      - name: Trigger EC2 Push-to-Deploy Webhook (Fallback)
        if: steps.ec2_ssh.outcome == 'failure'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: No production EC2 host configured."
            exit 1
          fi
          WEBHOOK_URL="https://${EC2_HOST//./-}.sslip.io/api/github/webhook"
          echo "Target Webhook: $WEBHOOK_URL"
          
          export PAYLOAD=$(node -e "
            const p = {
              ref: 'refs/heads/' + (process.env.GITHUB_REF_NAME || 'main'),
              after: process.env.GITHUB_SHA || '',
              head_commit: {
                id: process.env.GITHUB_SHA || '',
                message: process.env.COMMIT_MSG || 'Automated CI/CD deployment',
                author: { name: process.env.GITHUB_ACTOR || 'github-actions' }
              }
            };
            console.log(JSON.stringify(p));
          ")
          
          SIG_HEADER=()
          if [ -n "$WEBHOOK_SECRET" ]; then
            SIG=$(node -e "
              const crypto = require('crypto');
              const hmac = crypto.createHmac('sha256', process.env.WEBHOOK_SECRET);
              hmac.update(Buffer.from(process.env.PAYLOAD || '{}'));
              console.log('sha256=' + hmac.digest('hex'));
            ")
            SIG_HEADER=(-H "X-Hub-Signature-256: $SIG")
          fi
          
          echo "Dispatching deployment webhook..."
          HTTP_CODE=$(curl -k -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: gha-${GITHUB_RUN_ID}" \
            "${SIG_HEADER[@]}" \
            -d "$PAYLOAD" \
            --max-time 15 || echo "000")
            
          echo "HTTPS Response: $HTTP_CODE"
          cat /tmp/resp.json 2>/dev/null || true
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Trying HTTP port 3000..."
            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "http://${EC2_HOST}:3000/api/github/webhook" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-GitHub-Delivery: gha-${GITHUB_RUN_ID}" \
              "${SIG_HEADER[@]}" \
              -d "$PAYLOAD" \
              --max-time 15 || echo "000")
            echo "HTTP 3000 Response: $HTTP_CODE"
            cat /tmp/resp.json 2>/dev/null || true
          fi

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✔ EC2 backend webhook delivery succeeded (HTTP $HTTP_CODE)."
            echo "DEPLOYMENT_DELIVERY=WEBHOOK" >> "$GITHUB_ENV"
          else
            echo "EC2 webhook delivery failed with HTTP $HTTP_CODE."
            if [ "${DEPLOYMENT_DELIVERY:-NONE}" = "NONE" ]; then
              echo "ERROR: Neither SSH nor webhook delivered this commit to EC2."
              exit 1
            fi
          fi

      - name: Verify EC2 Backend Health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: No production EC2 host configured."
            exit 1
          fi
          HEALTH_URL="https://${EC2_HOST//./-}.sslip.io/api/health"
          FALLBACK_URL="http://${EC2_HOST}:3000/api/health"
          echo "Pinging EC2 Health at $HEALTH_URL..."
          
          for i in 1 2 3 4 5; do
            echo "Health verification attempt $i/5..."
            HEALTH_JSON=$(curl -k -sS "$HEALTH_URL" --max-time 5 || true)
            if [ -n "$HEALTH_JSON" ]; then
              HEALTH_STATUS=$(node -e "try { const x=JSON.parse(process.argv[1]); process.stdout.write(x.status || '') } catch { process.stdout.write('') }" "$HEALTH_JSON")
              RUNNING_COMMIT=$(node -e "try { const x=JSON.parse(process.argv[1]); process.stdout.write(x.deployedCommit || '') } catch { process.stdout.write('') }" "$HEALTH_JSON")
              if [ "$HEALTH_STATUS" = "ok" ] && [ "$RUNNING_COMMIT" = "$GITHUB_SHA" ]; then
                echo "✔ EC2 backend is healthy and running the exact GitHub SHA: $RUNNING_COMMIT"
                exit 0
              fi
              echo "Health responded, but exact commit verification failed. status=$HEALTH_STATUS runningCommit=$RUNNING_COMMIT expected=$GITHUB_SHA"
            fi

            FALLBACK_JSON=$(curl -sS "$FALLBACK_URL" --max-time 5 || true)
            if [ -n "$FALLBACK_JSON" ]; then
              HEALTH_STATUS=$(node -e "try { const x=JSON.parse(process.argv[1]); process.stdout.write(x.status || '') } catch { process.stdout.write('') }" "$FALLBACK_JSON")
              RUNNING_COMMIT=$(node -e "try { const x=JSON.parse(process.argv[1]); process.stdout.write(x.deployedCommit || '') } catch { process.stdout.write('') }" "$FALLBACK_JSON")
              if [ "$HEALTH_STATUS" = "ok" ] && [ "$RUNNING_COMMIT" = "$GITHUB_SHA" ]; then
                echo "✔ EC2 backend HTTP:3000 is healthy and running the exact GitHub SHA: $RUNNING_COMMIT"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "ERROR: EC2 backend health/commit verification failed after deployment delivery."
          exit 1

      - name: Verify Production Database Connectivity and Transactions
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          if [ -z "$EC2_HOST" ]; then echo "ERROR: No production EC2 host configured."; exit 1; fi
          mkdir -p ~/.ssh
          python3 scripts/prepare_ec2_key.py
          test -s ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "cd /home/ubuntu/gigpilot && DATABASE_URL=$(printf '%q' "$DATABASE_URL") node -" < scripts/verify-ec2-db.cjs

      - name: Report EC2 Status to Step Summary
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          echo "### 🛡️ AWS EC2 Backend Auto-Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** gigpilot-backend" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Host:** \`$EC2_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Strategy:** SSH direct pull & PM2 restart + Signed Webhook fallback" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint:** [https://${EC2_HOST//./-}.sslip.io/api/health](https://${EC2_HOST//./-}.sslip.io/api/health)" >> $GITHUB_STEP_SUMMARY
