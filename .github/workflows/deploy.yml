name: Deploy Python FastAPI + React

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for exact commit CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" -o /tmp/checks.json
            python3 - <<'PY'
import json
d=json.load(open('/tmp/checks.json'))
c=next((x for x in d.get('check_runs',[]) if x.get('name')=='Typecheck and production build'),None)
print(c.get('status','') if c else 'pending', c.get('conclusion','') if c else '')
PY
            if python3 - <<'PY'
import json,sys
d=json.load(open('/tmp/checks.json'))
c=next((x for x in d.get('check_runs',[]) if x.get('name')=='Typecheck and production build'),None)
sys.exit(0 if c and c.get('conclusion')=='success' else 1)
PY
            then exit 0; fi
            if python3 - <<'PY'
import json,sys
d=json.load(open('/tmp/checks.json'))
c=next((x for x in d.get('check_runs',[]) if x.get('name')=='Typecheck and production build'),None)
sys.exit(0 if c and c.get('conclusion') in {'failure','cancelled','timed_out'} else 1)
PY
            then exit 1; fi
            sleep 15
          done
          exit 1

  deploy-python:
    needs: wait-for-ci
    name: Deploy Python FastAPI + React to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || '' }}
        run: |
          set -euo pipefail
          printf '%s' "$DATABASE_URL" | grep -Eq '^postgres(ql)?://'
          echo "::add-mask::$DATABASE_URL"

      - name: Deploy over existing approved SSH path
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY || '' }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          test -n "$EC2_HOST"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "echo SSH_OK"
          {
            printf 'export DATABASE_URL=%q\n' "$DATABASE_URL"
            printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"
            printf 'export BYBIT_API_KEY=%q\n' "$BYBIT_API_KEY"
            printf 'export BYBIT_API_SECRET=%q\n' "$BYBIT_API_SECRET"
            printf 'export GITHUB_TOKEN=%q\n' "$GITHUB_TOKEN"
            cat scripts/deploy-ec2.sh
          } | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "bash -s"

      - name: Verify exact live FastAPI SHA and frontend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"; fi
          BASE="https://${EC2_HOST//./-}.sslip.io"
          for attempt in $(seq 1 20); do
            if curl -kfsS "$BASE/api/health" -o /tmp/health.json; then
              python3 - <<'PY'
import json,os,sys
x=json.load(open('/tmp/health.json')); expected=os.environ['GITHUB_SHA']
assert x.get('deployedCommit')==expected,(x.get('deployedCommit'),expected)
assert x.get('autonomousEngine',{}).get('reachable') is True
print("exact FastAPI SHA:",x['deployedCommit'])
PY
              curl -kfsS "$BASE/" | grep -Eiq '<html|<script|<div'
              curl -kfsS "$BASE/version.json" | python3 -c 'import json,sys,os; x=json.load(sys.stdin); assert x.get("commit")==os.environ["GITHUB_SHA"],x'
              exit 0
            fi
            sleep 5
          done
          echo "Live FastAPI verification failed"
          exit 1
