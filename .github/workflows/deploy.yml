name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Test, Lint & Compile Validation Job
  # --------------------------------------------------------------------------
  test-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Generate Prisma Client (if present)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi

      - name: Run Test Suite & Type Checking
        run: npm test

      - name: Run Production Build
        run: npm run build

  # --------------------------------------------------------------------------
  # 2. Automated Production Deployment (Render)
  # --------------------------------------------------------------------------
  deploy-production:
    name: Trigger Render Production Deployment
    needs: test-and-build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ℹ️  [Render Deploy Hook]: RENDER_DEPLOY_HOOK_URL secret not configured in GitHub."
            echo "👉 If your Render service has auto-deploy enabled on GitHub commits, Render is building automatically."
            echo "👉 To trigger manual instant webhook deploys, add RENDER_DEPLOY_HOOK_URL to GitHub Repository Secrets."
            exit 0
          fi

          echo "🚀 Triggering instant deployment on Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Render Response: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deployment successfully triggered on Render!"
          else
            echo "❌ Failed to trigger Render deploy hook. HTTP Status: $HTTP_STATUS"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # 3. Automated Backend Deployment (AWS App Runner)
  # --------------------------------------------------------------------------
  deploy-aws-backend:
    name: Trigger AWS App Runner Deployment
    needs: test-and-build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS Credentials & Service ARN
        id: check-aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_APP_RUNNER_SERVICE_ARN: ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_APP_RUNNER_SERVICE_ARN" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            # Extract region automatically from ARN: arn:aws:apprunner:<region>:<account>:service/...
            ARN_REGION=$(echo "$AWS_APP_RUNNER_SERVICE_ARN" | cut -d: -f4)
            TARGET_REGION="${AWS_REGION:-${ARN_REGION:-us-east-1}}"
            echo "region=$TARGET_REGION" >> $GITHUB_OUTPUT
            echo "ℹ️ AWS Region configured: $TARGET_REGION"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  AWS App Runner service ARN or credentials not set in GitHub secrets."
            echo "👉 If your AWS App Runner service has Automatic Deploy enabled with apprunner.yaml, AWS auto-deploys on every git push directly."
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.check-aws.outputs.region }}

      - name: Start AWS App Runner Deployment
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          echo "🚀 Triggering deployment on AWS App Runner..."
          OPERATION_ID=$(aws apprunner start-deployment \
            --service-arn "${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}" \
            --query 'OperationId' \
            --output text)
          echo "✅ AWS App Runner deployment initiated successfully with Operation ID: $OPERATION_ID"
          echo "🌐 Fetching service details..."
          aws apprunner describe-service \
            --service-arn "${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}" \
            --query 'Service.{Status:Status, ServiceUrl:ServiceUrl, ServiceName:ServiceName}' \
            --output table || true

