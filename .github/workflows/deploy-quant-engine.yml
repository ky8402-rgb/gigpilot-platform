# Deploy the Python quant engine to the EC2 host, beside the Node service.
#
# WHY THIS IS A SEPARATE WORKFLOW
# ------------------------------
# `deploy.yml` (Node) carries `paths-ignore: ['quant-engine/**']` so engine changes cannot
# rebuild the backend. The engine therefore needs its own way onto the host, and it is kept
# independent in both directions: this workflow never touches the Node deployment, and a Node
# deploy never moves the engine.
#
# WHY IT IS MANUAL ONLY
# ---------------------
# `workflow_dispatch` and nothing else. The first cutover onto a host that already trades is a
# deliberate act, and an automatic engine deploy would mean that editing a Python file silently
# restarts a service on the production box. Automatic deploys can be added once the service has
# been stable here for a while; making it automatic on day one would be the wrong default.
#
# The only credentialed path to the host is `secrets.EC2_SSH_KEY`, which is unreadable by
# design — so this workflow is also the only way the migration can be performed at all.

name: Deploy quant-engine (EC2)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (default: the branch this run is dispatched from)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

# Serialised against any other deploy of this ref; a manual run must not overlap itself.
concurrency:
  group: deploy-quant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-quant-engine:
    name: Deploy Python engine to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.GIGPILOT_MUMBAI_EC2 }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: no production EC2 host configured."
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY is not configured, so the host cannot be reached."
            exit 1
          fi

          echo "Deploying quant-engine to $EC2_USER@$EC2_HOST..."

          mkdir -p ~/.ssh
          python3 scripts/prepare_ec2_key.py || true
          if [ ! -s ~/.ssh/id_rsa ]; then
            echo "ERROR: the SSH key could not be prepared."
            exit 1
          fi

          if ! ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa \
               "$EC2_USER@$EC2_HOST" "echo SSH_OK" 2>/dev/null | grep -q "SSH_OK"; then
            echo "ERROR: no SSH path to the host. There is no fallback by design."
            exit 1
          fi
          echo "✔ SSH access verified."

          # Only a non-secret control value travels here. The engine reads its own credentials
          # from its own SSM prefix on the host, via the instance role, using
          # scripts/update-env.js — the same safe writer the Node deploy uses, so no sed and no
          # escaping failure can corrupt either service's .env.
          { printf 'export QUANT_DEPLOY_REF=%q\n' "${DEPLOY_REF:-origin/main}"; \
            cat scripts/deploy-quant-engine.sh; } \
            | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_rsa \
                "$EC2_USER@$EC2_HOST" "bash -s"

      - name: Verify the Node service was not disturbed
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
        run: |
          if [ -z "$EC2_HOST" ] && [ -f deployment/backend-host.txt ]; then
            EC2_HOST="$(tr -d '\r\n' < deployment/backend-host.txt)"
          fi
          # The engine runs beside the grid trader, so a migration that broke the trader would
          # otherwise be discovered by the trader failing rather than by this workflow.
          echo "Checking the Node service is still healthy..."
          for i in $(seq 1 10); do
            code="$(curl -sS -m 15 -o /tmp/gigpilot-health.json -w '%{http_code}' \
              "https://${EC2_HOST}/api/health" 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "✔ Node /api/health still 200"
              cat /tmp/gigpilot-health.json | head -c 200; echo
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: the Node service did not answer /api/health after the engine deployment."
          exit 1
