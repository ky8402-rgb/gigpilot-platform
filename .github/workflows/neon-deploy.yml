name: Push Database Schema to Neon

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'prisma/**'
      - '.github/workflows/neon-deploy.yml'
  workflow_dispatch:

concurrency:
  group: neon-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: https://3-222-149-9.sslip.io
  REACT_APP_API_URL: https://3-222-149-9.sslip.io
  VITE_BACKEND_URL: https://3-222-149-9.sslip.io

jobs:
  migrate-to-neon:
    name: Sync Schema & Migrate to Neon PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify DATABASE_URL secret
        id: check_db
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "has_db=false" >> $GITHUB_OUTPUT
            echo "::warning::DATABASE_URL secret is not configured in GitHub Secrets. Prisma migration skipped."
          else
            echo "has_db=true" >> $GITHUB_OUTPUT
          fi

      - name: Push Prisma Schema to Neon Database
        if: steps.check_db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Syncing schema to Neon PostgreSQL..."
          npx prisma db push --accept-data-loss --skip-generate
          npx prisma generate
          echo "Successfully pushed database schema to Neon!"
